[project]
name = "pos-to-ledger"
version = "0.1.0"
description = "Hospitality POS daily sales to balanced journals, trial balance, VAT summary and Business Central."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pos-ledger = "pos_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pos_ledger"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
